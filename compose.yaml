name: skilllink-local
services:
  mongo:
    image: mongo:7.0
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { if (!rs.status().ok) quit(1); } catch (e) { if (e.codeName === 'NotYetInitialized') { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}); } else { quit(1); } } if (!db.hello().isWritablePrimary) quit(1);"
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 30
volumes:
  mongo-data:
